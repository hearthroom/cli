name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sandbox-contract:
    name: sandbox SDK contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the public author's sandbox contract
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/hearthroom/hearthroom/main/web/public/contracts/sandbox-contract.json \
            --output "$RUNNER_TEMP/sandbox-contract.json"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: HEARTHROOM_SANDBOX_CONTRACT="$RUNNER_TEMP/sandbox-contract.json" go test ./internal/check -run TestSandboxSDKContract -v

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: build and run
        run: |
          go build -o hearthroom-bin ./cmd/hearthroom
          ./hearthroom-bin version
          ./hearthroom-bin --help > /dev/null
        shell: bash

  snapshot:
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          HOMEBREW_TAP_TOKEN: ""
      - run: ls -la dist/
